name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The whole suite runs with every sponsor flag OFF, so CI exercises the demo floor:
# the offline path (local sandbox + local scorer + canned mutations) must always be green.
env:
  FEATURE_DAYTONA: "0"
  FEATURE_BRAINTRUST: "0"
  FEATURE_FIREWORKS: "0"
  USE_BRAINTRUST_GATEWAY: "0"

jobs:
  python:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Benchmark dataset is regenerable (no drift)
        run: |
          python scripts/build_task.py
          git diff --exit-code data/task/coding_bench.json \
            || (echo "::error::data/task/coding_bench.json is stale; re-run scripts/build_task.py" && exit 1)
      - name: Test (offline path, all sponsor flags off)
        run: pytest --cov=darwin --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  climb-smoke:
    name: offline climb smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Evolution climbs offline (end to end)
        run: |
          python -m darwin.main --offline | tee run.out
          python - <<'PY'
          import re, sys
          text = open("run.out").read()
          m = re.search(r"fitness curve: (\[[^\]]*\])", text)
          assert m, "no fitness curve in output"
          curve = eval(m.group(1))
          assert curve == sorted(curve), f"climb not monotonic: {curve}"
          assert curve[-1] >= 0.9, f"final fitness too low: {curve[-1]}"
          print("OK climb:", curve)
          PY

  dashboard:
    name: dashboard typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        working-directory: dashboard
        run: npm ci || npm install
      - name: Typecheck
        working-directory: dashboard
        run: npm run lint
      - name: Build
        working-directory: dashboard
        run: npm run build
