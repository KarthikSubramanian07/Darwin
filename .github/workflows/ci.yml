name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test (offline: all sponsor flags off)
        env:
          FEATURE_DAYTONA: "0"
          FEATURE_BRAINTRUST: "0"
          FEATURE_FIREWORKS: "0"
          FEATURE_CODERABBIT: "0"
        run: pytest --cov=darwin --cov-report=term-missing

  dashboard:
    name: dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build (skips cleanly until dashboard is scaffolded)
        working-directory: dashboard
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build --if-present
          else
            echo "dashboard not scaffolded yet; skipping"
          fi
