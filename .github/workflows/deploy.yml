name: Deploy dashboard

# Continuous deployment: every push to main that touches the dashboard rebuilds it and ships it
# to Cloudflare Pages (https://trydarwin.pages.dev).
#
# One-time setup by the repo owner (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  your account id (wrangler whoami shows it)
# Without those secrets this workflow no-ops instead of failing.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check secrets present
        id: gate
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set; skipping deploy. Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID."
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build
        if: steps.gate.outputs.ok == 'true'
        working-directory: dashboard
        run: |
          npm ci || npm install
          npm run build
      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard/dist --project-name trydarwin --branch main
