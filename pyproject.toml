[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# PyPI name: "darwin" is taken. The import package and the CLI command are still `darwin`.
name = "trydarwin"
version = "0.1.0"
description = "An agent that evolves itself — safely, inside sandboxes it cannot escape."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
keywords = ["ai-agents", "evolutionary-algorithms", "self-improving-ai", "llm-routing", "sandboxing"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Environment :: Console",
]
authors = [{ name = "Karthik Subramanian" }]
dependencies = [
  "python-dotenv>=1.2.2",
  "openai>=2.48.0",
  "fastapi>=0.140.0",
  "uvicorn[standard]>=0.51.0",
  "pydantic>=2.13.4",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
# Sponsor SDKs are imported lazily, only when their FEATURE_* flag is on.
daytona = ["daytona"]
braintrust = ["braintrust", "autoevals"]
all = ["daytona", "braintrust", "autoevals"]

[project.urls]
Homepage = "https://trydarwin.pages.dev"
Documentation = "https://trydarwin.pages.dev/developers"
Repository = "https://github.com/KarthikSubramanian07/Darwin"

[project.scripts]
darwin = "darwin.main:main"
darwin-server = "darwin.server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["darwin"]

# Ship the built-in benchmark tasks inside the wheel so an installed CLI runs with no clone.
[tool.hatch.build.targets.wheel.force-include]
"data/task" = "darwin/_data/task"

[tool.hatch.build.targets.sdist]
include = ["darwin", "data/task", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["darwin"]
omit = ["*/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
